apiVersion: v1
kind: ServiceAccount
metadata:
  name: relaypine-deployer
  namespace: relaypine-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: relaypine-deployer
  namespace: relaypine-dev
rules:
  - apiGroups: [""]
    resources: [configmaps, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: relaypine-deployer
  namespace: relaypine-dev
subjects:
  - kind: ServiceAccount
    name: relaypine-deployer
    namespace: relaypine-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: relaypine-deployer
---
apiVersion: v1
kind: Secret
metadata:
  name: relaypine-deployer-token
  namespace: relaypine-dev
  annotations:
    kubernetes.io/service-account.name: relaypine-deployer
type: kubernetes.io/service-account-token
