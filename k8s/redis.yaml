apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relaypine-redis-data
  namespace: relaypine-dev
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: cbs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relaypine-redis
  namespace: relaypine-dev
  labels:
    app.kubernetes.io/name: relaypine
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: relaypine
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relaypine
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              umask 077
              printf 'requirepass %s\n' "$REDIS_PASSWORD" > /tmp/redis-auth.conf
              exec redis-server /tmp/redis-auth.conf --dir /data --appendonly yes --appendfsync everysec --save "" --protected-mode yes --maxmemory 128mb --maxmemory-policy noeviction
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relaypine-secrets
                  key: REDIS_PASSWORD
            - name: REDISCLI_AUTH
              value: $(REDIS_PASSWORD)
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            exec:
              command: [sh, -ec, "test \"$(redis-cli ping)\" = PONG"]
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -ec, "test \"$(redis-cli ping)\" = PONG"]
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: [sh, -ec, "test \"$(redis-cli ping)\" = PONG"]
            periodSeconds: 20
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: relaypine-redis-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: relaypine-redis
  namespace: relaypine-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: relaypine
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
