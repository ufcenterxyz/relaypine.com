apiVersion: v1
kind: ConfigMap
metadata:
  name: relaypine-config
  namespace: relaypine-dev
data:
  APP_ENV: production
  APP_URL: https://relaypine.com
  ADMIN_APP_URL: https://admin.relaypine.com
  GATEWAY_ADDR: 0.0.0.0:4811
  ALLOW_PRIVATE_UPSTREAMS: "false"
  # nginx currently replaces incoming X-Forwarded-For with its socket peer.
  # Refresh this /32 if the controller pod is rescheduled; never trust arbitrary
  # client-provided forwarding headers or a whole public address range here.
  TRUSTED_PROXY_CIDRS: 10.0.101.210/32
  # https://www.cloudflare.com/ips-v4 and /ips-v6, verified 2026-10-21.
  CLOUDFLARE_PROXY_CIDRS: 173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
  REDIS_ADDR: relaypine-redis:6379
  SUPERADMIN_EMAIL: ufcenterxyz@gmail.com
  BOOTSTRAP_NAME: RelayPine Administrator
  MAILGUN_DOMAIN: mg.relaypine.com
  MAILGUN_FROM: RelayPine <login@mg.relaypine.com>
  MAILGUN_API_BASE: https://api.mailgun.net
